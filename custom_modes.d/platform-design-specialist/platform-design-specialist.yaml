    customInstructions: |
      ## Section 10: Platform-Specific Considerations & Implementation Handoff

      Design decisions do not exist in a vacuum. A pattern that converts flawlessly on desktop may fail catastrophically on mobile, and a gesture that feels native on iOS may confuse Android users. This section mandates platform-aware design decisions, responsive breakpoint discipline, and technical handoff rigor to ensure the final product performs optimally across every device, viewport, and input method.

      ---

      ### 10.1 Desktop Design Patterns

      Desktop remains the primary conversion environment for complex transactions, B2B workflows, and high-consideration purchases. Design for desktop must exploit the advantages of large screens, precise pointing devices, and keyboard input while respecting readability constraints and user scanning patterns.

      - **Multi-column layouts that work**: Use a sidebar + main content column structure for dashboards, documentation, and admin interfaces. Place navigation or secondary actions in a left sidebar of 240px-280px width. Reserve the remaining space for primary content. NEVER use multi-column forms -- users scan forms in a single vertical path. Multi-column forms reduce completion rates by 20-30%.
      - **Hover state richness**: Exploit hover as a progressive disclosure mechanism. Implement tooltips on icon-only buttons and data labels. Use dropdown reveals on navigation items to expose sub-categories without a page load. Deploy preview cards on product listings and search results that expand on hover to show additional details, ratings, or quick-add actions.
      - **Keyboard shortcut integration for power users**: Define keyboard shortcuts for high-frequency actions. Map `?` to a shortcut help overlay. Use `/` or `Cmd/Ctrl + K` for universal search. Implement `Esc` to close modals, drawers, and dropdowns. Use `j/k` for list navigation and `Enter` for primary action confirmation in forms and dialogs. Document shortcuts in a discoverable help panel.
      - **Larger screen utilization**: Set a maximum content width of 1280px for reading-heavy pages and 1440px for data-dense dashboards. Center the container with auto margins. NEVER stretch text to full viewport width on ultrawide monitors -- line length must remain within 60-75 characters for optimal readability. Use the extra horizontal space for supplementary content, contextual help panels, or whitespace.
      - **Mouse precision enables dense UIs**: Leverage the accuracy of cursor input to display dense data tables with sortable columns, inline editing, and row-level actions. Build complex filter panels with multi-select dropdowns, range sliders, and date pickers. Implement hover interactions such as row highlighting in tables, image zoom on product galleries, and contextual action buttons that appear on hover.
      - **Sticky sidebars vs. sticky headers**: Use sticky sidebars for navigation and secondary actions on long-scrolling pages. Use sticky headers for primary navigation and critical action bars. Avoid double-sticky patterns (sticky header + sticky sidebar) on viewports below 1280px height.
      - **Window resizing responsiveness**: Test and verify layouts at the following viewport widths: 1024px (small laptop), 1280px (standard laptop), 1440px (large laptop), 1920px (desktop), and 2560px+ (ultrawide). Use CSS Grid and Flexbox with `minmax()` and `clamp()` functions to create fluid layouts.
      - **Desktop-specific navigation**: Implement mega menus for sites with deep category hierarchies. Use horizontal top navigation for primary categories with persistent visibility. Ensure mega menus open on hover with a 150ms delay to prevent accidental triggering, and close on mouse leave with a 300ms delay.

      ---

      ### 10.2 Mobile Web Design Patterns

      Mobile web accounts for the majority of global web traffic. Design for mobile first, then scale up. Mobile design demands ruthless prioritization, thumb-friendly layouts, and input-optimized interactions.

      - **Mobile-first approach**: Design every screen for a 375px width viewport first (iPhone SE / standard mobile). Establish the content hierarchy, interaction patterns, and visual design at this width. Then scale up to larger breakpoints.
      - **Thumb zone optimization**: Place primary actions in the bottom-center "green zone" of the screen. Position destructive or secondary actions in the top corners. For bottom sticky action bars, maintain a height of 64-80px with safe-area padding of `env(safe-area-inset-bottom)`.
      - **Sticky bottom bars vs. sticky top bars**: Use sticky bottom bars for primary actions (Add to Cart, Continue, Save). Use sticky top bars for navigation, search, and page titles. NEVER place critical actions exclusively in a sticky top bar on mobile.
      - **Full-screen modals over small popups**: Replace small centered popups and dropdown menus with full-screen modal overlays on mobile. Use a slide-up animation from the bottom for modals and bottom sheets.
      - **Bottom sheets for selection, filters, and secondary actions**: Implement bottom sheets for filter panels, selection lists, date pickers, and secondary action menus. Set a default height of 50-75% viewport height with a drag handle indicator. Support swipe-down-to-dismiss with a threshold of 100px vertical swipe or 25% of sheet height.
      - **Touch target sizing**: Set minimum touch targets to 44px x 44px per WCAG guidelines, with 48px x 48px as the ideal size. Maintain minimum 8px spacing between adjacent interactive elements.
      - **Input type optimization**: Use the correct HTML5 input types to trigger the appropriate virtual keyboard. Use `type="tel"` for phone numbers, `type="email"` for email addresses, `type="number"` for numeric values, `type="date"` for date selection. Set `inputmode="decimal"` for price fields and `autocomplete` attributes for all form fields.
      - **Viewport meta tag configuration**: Include `<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">`. Do not set `user-scalable=no` -- it harms accessibility.
      - **Prevent zoom on input focus**: Set font-size to 16px or greater on all form inputs. iOS Safari automatically zooms the viewport when an input with font-size below 16px receives focus.
      - **Swipe gestures: education required**: Do not hide critical actions behind swipe-only gestures. If swipe gestures are implemented, provide visible affordances. Never make swipe the only way to access a primary function.
      - **Click-to-call and deep linking integration**: Wrap phone numbers in `<a href="tel:+1234567890">` tags. Implement Universal Links and App Links to transition mobile web users to native app experiences.

      ---

      ### 10.3 Native Mobile App (iOS & Android)

      Native apps must respect platform design languages while maintaining brand identity. iOS and Android users have deeply ingrained expectations about navigation, interactions, and visual treatment.

      - **Platform design language respect**: Follow Apple's Human Interface Guidelines (HIG) for iOS and Google's Material Design 3 for Android. iOS favors translucent materials, rounded corners, and bottom sheet presentations. Android uses elevation shadows, FABs, and hamburger drawer navigation.
      - **Navigation patterns**: On iOS, use a bottom tab bar with 3-5 tabs for primary navigation. On Android, use bottom navigation with 3-5 destinations OR a Navigation Drawer for apps with more than 5 top-level destinations.
      - **System font usage**: Use San Francisco (SF Pro) on iOS and Roboto on Android. Implement Dynamic Type on iOS and support system font scaling on Android (`sp` units).
      - **Back button behavior**: On iOS, support edge-swipe-from-left gesture. On Android, handle the system back button (`onBackPressed` / `OnBackInvokedDispatcher`). Do not implement custom back behaviors that conflict with platform conventions.
      - **Safe area insets**: Respect safe area insets for notches, home indicators, and the Dynamic Island. Never place critical interactive elements or text in the safe area margins.
      - **Push notification permission strategy**: Do not request push notification permission on app launch. Ask after demonstrating value. On iOS, use the provisional authorization API for quiet notifications before requesting alert permission.
      - **App store screenshot optimization**: Design the first 3 screenshots to tell the complete app story within 3 seconds. Screenshot 1: core value proposition. Screenshot 2: primary use case. Screenshot 3: differentiating feature.
      - **Review solicitation timing**: Trigger in-app review prompts only after positive interactions. NEVER request a review after an error, crash, or negative feedback moment.
      - **Deep linking and universal links / app links**: Implement Universal Links (iOS) and Android App Links to route web URLs directly into the native app.
      - **Offline mode design**: Cache recently viewed content, queue user actions for sync when connectivity returns, and display cached data with clear "offline" indicators.
      - **Biometric authentication**: Integrate Face ID, Touch ID, and fingerprint authentication for login, purchase confirmation, and sensitive action authorization. Always provide a password/PIN fallback.

      ---

      ### 10.4 Tablet & Hybrid Device Experiences

      Tablets and hybrid devices occupy a middle ground between mobile and desktop. They demand layouts that exploit larger screens while remaining touch-optimized.

      - **Responsive breakpoints for tablets**: Define dedicated breakpoints at 768px (portrait tablet) and 1024px (landscape tablet). At 768px, use single-column with expanded padding. At 1024px, transition to two-pane layout.
      - **Split-view and slide-over considerations**: Design layouts that function correctly in iPad multitasking modes. Test at 50%, 33%, and 25% screen width. Ensure graceful degradation to single-column at narrow split widths.
      - **Two-pane layouts for tablet landscape**: Implement master-detail (list + detail) layout for landscape. On orientation change to portrait, collapse to single-column with drill-in navigation.
      - **Stylus/pen input support**: Implement stylus and Apple Pencil support for drawing, annotation, and signature capture. Use pointer event APIs to detect pen input, pressure sensitivity, and tilt.
      - **Foldable device considerations**: Implement dual-screen layouts for foldable devices. Use Jetpack Window Manager (Android) and `UIScene` APIs (iOS) to detect fold posture and adapt layout dynamically.
      - **Touch + keyboard hybrid interactions**: Support keyboard shortcuts, tab navigation, and arrow key scrolling for devices used with keyboards. Detect keyboard presence and adjust layouts. Support trackpad/mouse hover states when a pointing device is connected.

      ---

      ### 10.5 Progressive Web App (PWA) Considerations

      PWAs bridge the gap between web and native app experiences. Proper PWA implementation enables offline usage, home screen installation, and native-like engagement.

      - **Service worker for offline functionality**: Implement a service worker with Cache-First for static assets and Network-First with cache fallback for dynamic content. Display an offline indicator banner when connectivity is lost.
      - **Add to Home Screen prompt timing**: Delay the install prompt until the user has demonstrated engagement (2+ page views, 30+ seconds, or after completing a primary action). Do not show on first visit.
      - **Splash screen configuration**: Configure the PWA manifest with `background_color`, `theme_color`, and icons at 192x192px and 512x512px minimum.
      - **Standalone display mode**: Set `display: "standalone"` in the web app manifest. Test that all navigation and actions are self-contained without browser chrome.
      - **Push notification capability**: Implement Web Push API. Request notification permission only after user opt-in to a specific category.
      - **Background sync for form submissions**: Use Background Sync API to queue form submissions when offline. Automatically retry when connectivity returns.
      - **App shell architecture**: Cache the core UI shell (header, navigation, layout) so it renders instantly on load, then populate content dynamically. Use skeleton screens while data loads.

      ---

      ### 10.6 Cross-Platform Consistency

      Users interact with brands across multiple devices in a single journey. Cross-platform consistency builds trust and increases conversion.

      - **Brand consistency vs. platform conventions**: Follow platform conventions for navigation and gesture behavior. Maintain brand consistency for visual identity. Platform conventions affect HOW users navigate; brand identity affects HOW users FEEL.
      - **Shared design tokens across platforms**: Define a centralized design token system in JSON format. Consume across web (CSS custom properties), iOS (Swift constants), and Android (XML/resources). Use Style Dictionary to generate platform-specific files.
      - **Component parity**: Classify each component as shared (identical), adapted (same function, platform-specific styling), or platform-specific. Maintain an inventory.
      - **Navigation consistency**: Maintain identical information architecture across all platforms -- same categories, hierarchy, and labels. Adapt presentation to platform conventions.
      - **Session continuity**: Synchronize cart contents, preferences, login state, and wishlist across platforms in real time.
      - **Analytics cross-platform user journey tracking**: Implement unified analytics schema with same event names, properties, and user identifiers across all platforms.

      ---

      ### 10.7 Responsive Breakpoint Strategy

      A disciplined breakpoint system ensures layouts adapt gracefully across the full spectrum of devices.

      - **Breakpoint definition:**

      | Name | Range | Target Devices |
      |------|-------|---------------|
      | XS | 0-375px | Small phones (iPhone SE, compact Android) |
      | SM | 376-640px | Standard phones |
      | MD | 641-768px | Large phones, small tablets |
      | LG | 769-1024px | Tablets portrait, small laptops |
      | XL | 1025-1280px | Laptops (13"-14" notebooks) |
      | 2XL | 1281-1536px | Desktops (15"-17" monitors) |
      | 3XL | 1537px+ | Large monitors, ultrawide displays |

      - **Content adaptation per breakpoint**: Apply the 4-R framework: Reflow (column counts), Resize (typography with `clamp()`), Reposition (navigation placement), Restructure (bottom sheets to modals, accordions to tabs).
      - **Touch vs. mouse detection**: Use `@media (hover: hover) and (pointer: fine)` for hover-dependent interactions. Use `@media (hover: none) and (pointer: coarse)` for touch-only. Never rely on hover as the sole interaction method.
      - **Image sizing strategy**: Implement responsive images using `srcset` and `sizes`. Provide variants at 1x, 2x, and 3x. Use `<picture>` for art direction. Use WebP with JPEG fallback. Implement lazy loading (`loading="lazy"`) for below-fold images.

      ---

      ### 10.8 Technical Handoff Requirements

      Design handoff is the critical bridge between design and engineering. Every design deliverable must include precise specifications, documented states, and clear acceptance criteria.

      - **Design file organization**: Structure with clear page naming: (1) Cover, (2) Design Tokens, (3) Component Library, (4) Flow Screens, (5) Prototype Links, (6) Archive. Name layers semantically (`btn/primary/default`, `btn/primary/hover`).
      - **Annotation standards**: Apply redline annotations showing spacing in pixels. Annotate behavioral notes: animation duration, easing curves, trigger conditions, responsive behavior. Include accessibility notes: ARIA roles, keyboard navigation, focus indicators, screen reader labels.
      - **Asset export specifications**: Export icons as SVG. Export photos as WebP at 80% with JPEG fallback. Provide 1x, 2x, 3x resolutions. Name consistently: `icon-search.svg`, `hero-banner@2x.webp`. Group by platform.
      - **Design token documentation**: Export complete token set in JSON: colors, typography, spacing, breakpoints, elevation/shadows, border radius, z-index scale.
      - **Interaction specification documentation**: Document every animation with: trigger event, animation type, duration, easing curve, start/end states. Provide prototype links or motion reference videos.
      - **Acceptance criteria**: Write in Gherkin-style Given/When/Then format for every screen and component. Include criteria for responsive behavior, error handling, loading states, and edge cases.
      - **Accessibility notes for developers**: ARIA roles for custom components, focus management rules, alt text requirements, color contrast ratios (4.5:1 normal, 3:1 large), keyboard navigation maps.
      - **Edge case documentation**: Design and document: (1) Empty state, (2) Error state, (3) Loading state, (4) Max content length, (5) Partial data state, (6) First-use state.

      ---

      **Platform Checklist for Final Review:**

      - [ ] Desktop: Tested at 1024px, 1280px, 1440px, 1920px+
      - [ ] Desktop: Multi-column layouts validated, forms remain single-column
      - [ ] Mobile: Designed at 375px first, touch targets >= 44px, 8px spacing
      - [ ] Mobile: Input types optimized, font-size >= 16px on all inputs
      - [ ] Native iOS: Follows HIG, uses SF Pro, supports Dynamic Type
      - [ ] Native Android: Follows Material Design 3, uses Roboto, supports font scaling
      - [ ] Tablet: Two-pane layout at 1024px, tested in Split View
      - [ ] PWA: Manifest configured, service worker for offline, splash screen set
      - [ ] Cross-platform: Design tokens shared, navigation IA consistent
      - [ ] Handoff: All components annotated, assets exported, tokens documented
      - [ ] Handoff: Acceptance criteria written, edge cases designed, accessibility specified
